# Fly.io config for the room server. Runbook: deploy/DEPLOYING.md. Short version, from the repo root:
#   fly deploy --config deploy/fly.toml --dockerfile Dockerfile --depot=false
# First time only: fly launch ... --no-deploy; fly volumes create room_data --size 1;
#   fly secrets set GITHUB_CLIENT_ID=<OAuth App with Device Flow>; fly scale memory 512
app = "room-rohanz"
primary_region = "sin"

[build]
  dockerfile = "../Dockerfile"

[env]
  PORT = "8080"
  YPERSISTENCE = "/data"
  NODE_ENV = "production"         # refuses the test login issuer (GITHUB_CLIENT_ID=fake)
  ROOM_ADMINS = "rohanz"          # only the operator can approve hosted repositories
  ROOM_MANAGED_REPOS = "true"     # collaborators still join through GitHub push access
  ROOM_TRUST_PROXY = "true"       # Fly's proxy fronts every request: rate limits key on Fly-Client-IP, not the proxy address

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"      # idle machine stops; the next request or websocket wakes it
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
  method = "GET"

[mounts]
  source = "room_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"                 # 256 MB was OOM-killed under a large room; a deploy applies this value
