# Self-hosted room server. See deploy/self-hosting.md.
#
#   mkdir room && cd room
#   curl -fsSLO https://raw.githubusercontent.com/rohanz/room/main/deploy/docker-compose.yml
#   curl -fsSL  https://raw.githubusercontent.com/rohanz/room/main/deploy/.env.example -o .env
#   docker compose up -d
#
# Runs the published image ghcr.io/rohanz/room:<version>; `latest` follows the newest release.
# Pin a version with ROOM_IMAGE_TAG=0.17.18 in .env. To build from a checkout instead:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml up -d --build
#
# Default: one container, state (LevelDB docs, registry, sessions, audit.log) on the `room_data` volume.

services:
  room:
    image: ghcr.io/rohanz/room:${ROOM_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${ROOM_PORT:-8080}:8080"
    env_file:
      - path: ./.env
        required: false
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      YPERSISTENCE: /data
    volumes:
      - room_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  room_data:
