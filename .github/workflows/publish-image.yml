name: Publish server image

# Publishes ghcr.io/rohanz/room:<version> for every v<version> release tag; `latest`
# follows the newest tag. The version must match the plugin manifests (the same check
# packages/room-mcp/test/release-version.test.ts applies to a release commit).
# Run it by hand for an existing tag with the "ref" input.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to build, for example v0.17.18
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ inputs.ref || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve the version from the tag
        id: version
        run: |
          tag="${{ inputs.ref || github.ref_name }}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::expected a v<version> tag, got '$tag'"; exit 1 ;;
          esac
          version="${tag#v}"
          manifest=$(node -p "require('./plugins/room/.claude-plugin/plugin.json').version")
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag $tag does not match the plugin manifest version $manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rohanz/room:${{ steps.version.outputs.version }}
            ghcr.io/rohanz/room:latest
          labels: |
            org.opencontainers.image.title=Room server
            org.opencontainers.image.source=https://github.com/rohanz/room
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
