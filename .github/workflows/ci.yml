name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlite-state:
    name: SQLite state (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.22.3', '22.23.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Git Bash is available on Windows runners; env -u and quoting match checks.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Configure Git identity for tests
        run: git config --global user.name 'CI' && git config --global user.email 'ci@example.com'
      - name: Record actual runtime and committed bundle preflight
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Both locations must pass the actual two-connection commit/reopen WAL probe on
        # the expected native filesystem: Linux ext4, macOS APFS, Windows NTFS.
        run: |
          node scripts/sqlite-evidence.mjs --scratch-parent "$RUNNER_TEMP" --output "$RUNNER_TEMP/room-sqlite-runtime.json"
          node scripts/sqlite-evidence.mjs --scratch-parent "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/room-sqlite-workspace.json"
      - name: Local storage gate, bootstrap and privacy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: env -u ROOM_TAG -u ROOM_OWNER -u ROOM_SERVER npx vitest run --root packages/local-state --config vitest.config.ts --maxWorkers 1 --reporter default --reporter json --outputFile "$RUNNER_TEMP/room-sqlite-local-state.json"
      - name: Storage admission and emitted bundle contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Vitest substring filters work across shells; an unexpanded glob would match no files.
        run: env -u ROOM_TAG -u ROOM_OWNER -u ROOM_SERVER npx vitest run --root packages/room-mcp --config vitest.config.ts test/storage- --maxWorkers 1 --reporter default --reporter json --outputFile "$RUNNER_TEMP/room-sqlite-room-mcp.json"
      - name: Set up official Node below the floor (22.12)
        if: ${{ !cancelled() && matrix.node == '22.23.4' && matrix.os != 'macos-latest' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Prove 22.12 refuses before creating Room state
        if: ${{ !cancelled() && matrix.node == '22.23.4' && matrix.os != 'macos-latest' }}
        run: node scripts/sqlite-evidence.mjs --expect-refusal node-version --output "$RUNNER_TEMP/room-sqlite-refusal-22.12.0.json"
      - name: Set up official Node below the floor (22.14)
        if: ${{ !cancelled() && matrix.node == '22.23.4' && matrix.os != 'macos-latest' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Prove 22.14 refuses before creating Room state
        if: ${{ !cancelled() && matrix.node == '22.23.4' && matrix.os != 'macos-latest' }}
        run: node scripts/sqlite-evidence.mjs --expect-refusal node-version --output "$RUNNER_TEMP/room-sqlite-refusal-22.14.0.json"
      - name: Upload SQLite runtime and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-state-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/room-sqlite-*.json
          if-no-files-found: warn

  windows-durable-files:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check durable directory creation on Windows
        run: >-
          npx vitest run
          packages/local-state/test/durable-directory.test.ts
          packages/server/test/durable-directory.test.ts
          packages/relay/test/private-state.test.ts
          packages/local-state/test/private-state-prime.test.ts
          packages/relay/test/daemon-launch.test.ts

  windows-native-smoke:
    name: Native Windows smoke (fake hosts, no model calls)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record native OS and runtime
        run: node -e "console.log(JSON.stringify({kind:'real OS + fake host',platform:process.platform,arch:process.arch,node:process.version,os:require('node:os').release()}))"
      # Package configs use package-relative include paths. Vitest resolves --config against --root.
      # Setup clears inherited Room/host identity, points config at temp, and never uses account credentials.
      - name: Relay process identity on Windows
        run: npx vitest run --root packages/local-state --config vitest.config.ts test/windows-process.test.ts --maxWorkers 1 --reporter default --reporter json --outputFile "$env:RUNNER_TEMP/room-windows-relay.json"
      - name: Worker process and shell identity on Windows
        run: npx vitest run --root packages/room-mcp --config vitest.config.ts test/windows-process.test.ts test/windows-process-native.test.ts test/launch-identity.test.ts test/worker-shell-env.test.ts --maxWorkers 1 --reporter default --reporter json --outputFile "$env:RUNNER_TEMP/room-windows-workers.json"
      - name: Local relay, hooks, executable paths and retained launch smoke
        run: npx vitest run --root packages/room-mcp --config vitest.config.ts test/windows-smoke.test.ts --maxWorkers 1 --reporter default --reporter json --outputFile "$env:RUNNER_TEMP/room-windows-smoke.json"
      - name: Preserve worktrees when process inspection is unavailable
        run: npx vitest run --root packages/room-mcp --config vitest.config.ts test/collect.test.ts -t "cwd inspection fails" --maxWorkers 1 --reporter default --reporter json --outputFile "$env:RUNNER_TEMP/room-windows-cleanup.json"
      - name: Windows Git common directory aliases
        run: npx vitest run --root packages/roomd --config vitest.config.ts test/windows-git-dirs.test.ts --maxWorkers 1 --reporter default --reporter json --outputFile "$env:RUNNER_TEMP/room-windows-git-dirs.json"
      - name: Browser launcher paths and URL preservation (mock OS opener)
        run: npx vitest run --root packages/room-mcp --config vitest.config.ts test/browser-open.test.ts --maxWorkers 1
      - name: Upload fake-host native Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-fake-host-results
          path: ${{ runner.temp }}/room-windows-*.json
          if-no-files-found: warn

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Check repository hygiene
        run: npx knip

  compat:
    name: Compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        id: compat-node
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Each directory is keyed by immutable pin commit + OS/arch/Node + recipe.
      # Prefix restore retains old releases when the pins list grows; candidate is never cached.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/room-compat-cache
          key: compat-prepared-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compat-node.outputs.node-version }}-${{ hashFiles('scripts/compat-matrix.mts', 'scripts/compat-process.mts') }}-${{ hashFiles('scripts/compat-pins.json') }}
          restore-keys: |
            compat-prepared-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compat-node.outputs.node-version }}-${{ hashFiles('scripts/compat-matrix.mts', 'scripts/compat-process.mts') }}-
      - name: Pinned old/new process wire fixtures (no model calls)
        env:
          COMPAT_CACHE_DIR: ${{ runner.temp }}/room-compat-cache
        run: npx tsx scripts/compat-matrix.mts

  # Keep the existing required "test" status as the gate for independent jobs.
  # A hygiene failure cannot suppress test/build evidence or silently become optional.
  test:
    if: ${{ always() }}
    needs: [checks, hygiene, compat, sqlite-state, windows-durable-files, windows-native-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require tests, builds, hygiene, compatibility and native storage
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          COMPAT_RESULT: ${{ needs.compat.result }}
          SQLITE_RESULT: ${{ needs.sqlite-state.result }}
          WINDOWS_DURABLE_RESULT: ${{ needs.windows-durable-files.result }}
          WINDOWS_SMOKE_RESULT: ${{ needs.windows-native-smoke.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$HYGIENE_RESULT" = success
          test "$COMPAT_RESULT" = success
          test "$SQLITE_RESULT" = success
          test "$WINDOWS_DURABLE_RESULT" = success
          test "$WINDOWS_SMOKE_RESULT" = success

  checks:
    runs-on: ubuntu-latest
    # The suite alone takes about 6 minutes on an M-series Mac and longer on a 4-vCPU runner;
    # the test watchdog already ends any single file after 15 minutes.
    timeout-minutes: 45
    # The full suite and plugin build run on Ubuntu; focused OS smoke also runs on native Windows.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Configure Git identity for tests
        run: git config --global user.name 'CI' && git config --global user.email 'ci@example.com'

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TEST_SCALE: '1'
        run: env -u ROOM_TAG -u ROOM_OWNER -u ROOM_SERVER npm test

      - name: Build web
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build -w @room/web

      - name: Build server image
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # The image installs packages/server/package.json on its own, outside the workspace.
        run: docker build -t room-server-ci .

      - name: Build plugin
        id: plugin
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:plugin

      - name: Check committed plugin assets
        if: ${{ !cancelled() && steps.plugin.outcome == 'success' }}
        # Locked dependencies, fixed esbuild target and content-hashed Vite assets;
        # neither build config injects timestamps or absolute build paths.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- plugins/room)" ]; then
            git status --short --untracked-files=all -- plugins/room
            git diff --stat -- plugins/room
            echo '::error::Plugin assets are out of date. Run npm run build:plugin and commit all generated files under plugins/room.'
            exit 1
          fi
